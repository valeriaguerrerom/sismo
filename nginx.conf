# Nginx para la SPA de SismoNariño.
# - Sirve los estáticos de Vite.
# - Reenvía /api al backend FastAPI (nombre del servicio en docker-compose).
# - Fallback a index.html para el enrutamiento del cliente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Estáticos con caché larga (Vite les pone hash en el nombre).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
