# Nginx para la SPA de SismoNariño (Railway / producción).
#
# Sirve los estáticos de Vite y hace fallback a index.html para el enrutamiento
# del cliente. El puerto lo inyecta Railway con $PORT (se sustituye al arrancar
# con envsubst; ver Dockerfile). NO hay proxy /api aquí: en Railway el backend
# es otro servicio con su propia URL pública, y el frontend lo llama directo
# mediante VITE_API_URL (definido en build). En docker-compose local, en cambio,
# el proxy lo resuelve la red interna y VITE_API_URL puede ir vacío.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 25m;

    # Estáticos con caché larga (Vite les pone hash en el nombre).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
