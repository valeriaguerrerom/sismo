# Nginx para la SPA de SismoNariño (Railway / producción).
#
# Sirve los estáticos de Vite y hace fallback a index.html para el enrutamiento
# del cliente. Escucha en un puerto FIJO (8080) para evitar problemas de
# sustitución de variables; en Railway se genera el dominio apuntando a 8080.
# NO hay proxy /api: el backend es otro servicio con su URL pública, y el
# frontend lo llama directo mediante VITE_API_URL (definido en el build).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 25m;

    # ── Cabeceras de seguridad ──
    # CSP compatible con: Supabase (REST/Auth/Storage), Google OAuth, Google
    # Fonts, teselas de OpenStreetMap (Leaflet) y el Mapa 3D (Three.js, que carga
    # sus texturas/datos desde /terrain y /textures locales → 'self').
    #
    # connect-src incluye el backend. Si el backend NO está en *.up.railway.app,
    # añade aquí su dominio exacto (p. ej. https://api.midominio.com).
    #
    # Notas:
    #  - style-src usa 'unsafe-inline' porque Tailwind/React aplican estilos en
    #    línea y Leaflet inyecta CSS; NO se permite 'unsafe-inline' en script-src.
    #  - img-src permite data: y blob: para los sismogramas/capturas (html2canvas,
    #    canvas de Three.js) y las teselas del mapa.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.supabase.co https://*.up.railway.app; frame-src https://accounts.google.com https://*.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-ancestors de la CSP ya impide el embebido; X-Frame-Options por compatibilidad.
    add_header X-Frame-Options "DENY" always;

    # Estáticos con caché larga (Vite les pone hash en el nombre).
    # Se repiten las cabeceras de seguridad porque un `add_header` en el location
    # anula los del server (nginx no los hereda si el bloque define alguno).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
