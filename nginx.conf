# Nginx para la SPA de SismoNariño (Railway / producción).
#
# Sirve los estáticos de Vite y hace fallback a index.html para el enrutamiento
# del cliente. Escucha en un puerto FIJO (8080) para evitar problemas de
# sustitución de variables; en Railway se genera el dominio apuntando a 8080.
# NO hay proxy /api: el backend es otro servicio con su URL pública, y el
# frontend lo llama directo mediante VITE_API_URL (definido en el build).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 25m;

    # Estáticos con caché larga (Vite les pone hash en el nombre).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
