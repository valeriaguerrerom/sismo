# SismoNariño — despliegue local con Docker (RNF-07)
#
#   docker compose up --build
#   Frontend: http://localhost:8080   Backend: http://localhost:8000/docs
#
# Variables: copia .env.example a .env (raíz) y backend/.env con las claves de Supabase.
services:
  backend:
    build: ./backend
    container_name: sismonarino-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Opcional: MiniSEED crudos para /api/waveforms (solo lectura).
      - ./backend/data_raw:/app/data_raw:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ""
    container_name: sismonarino-frontend
    environment:
      # connect-src de la CSP: en local el navegador llama al backend por :8000.
      BACKEND_ORIGIN: "http://localhost:8000"
      # En local se usa Report-Only para no romper nada mientras se prueba.
      CSP_HEADER_NAME: "Content-Security-Policy-Report-Only"
    ports:
      # Nginx escucha en 8080 dentro del contenedor (ver nginx.conf.template / Dockerfile).
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
